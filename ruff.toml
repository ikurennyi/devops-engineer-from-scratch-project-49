line-length = 80
target-version = "py315"

[lint]
preview = true
select = ["B", "E", "F", "I", "C90", "UP", "SIM", "S", "FURB", "RUF"]

[lint.per-file-ignores]
# В init-модулях допустимы неиспользуемые импорты
"__init__.py" = ["unused-import"]
# assert в тестах это норма pytest
"tests/**" = ["assert"]
# random в играх — не криптография
"brain_games/scripts/games/*.py" = ["S311"]
